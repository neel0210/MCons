[package]
name = "mcons-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCons core logic, ported as-is from the Swift macOS app: icon packs, folder icons, apply/reset with undo, export, updates"

[lib]
name = "mcons_core"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
ureq = { version = "2", features = ["json"] }
resvg = "0.45"
usvg = "0.45"
tiny-skia = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[dev-dependencies]
tempfile = "3"
