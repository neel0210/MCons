<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCons — Icons for macOS</title>
<style>
/* ============ MCons JetBlack design system (AppTheme.swift) ============ */
:root{
  --jet:#090A0F; --bg:#0C0E14; --sidebar:#08090D; --card:#13151F; --elevated:#1A1D2A; --surface:#1A1D2A;
  --accent:#6366F1; --accent2:#8B5CF6; --violet:#6C5CE7; --cyan1:#00D2FF; --cyan2:#3A7BD5;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.18);
  --subtitle:#94A3B8; --success:#10B981; --warning:#F59E0B; --error:#F43F5E;
  --text:#F5F7FA; --secondary:rgba(235,235,245,.60); --tertiary:rgba(235,235,245,.30);
  --blue:#0984E3; --green-new:#00B894; --yellow:#FFD200;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Rounded","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet);text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;width:100vw}
/* ============ Sidebar (ContentView SidebarView) ============ */
.sidebar{width:228px;flex:0 0 228px;background:var(--sidebar);display:flex;flex-direction:column;height:100vh;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:12px 12px 8px}
.brand img{width:30px;height:30px;border-radius:7px;box-shadow:0 1.5px 3px rgba(0,0,0,.25)}
.brand .bname{font-size:14px;font-weight:700;line-height:1.1}
.brand .bsub{font-size:10px;font-weight:500;color:var(--secondary);line-height:1.2}
.brand .vpill{margin-left:auto;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--secondary);background:rgba(255,255,255,.07);padding:2px 6px;border-radius:999px;white-space:nowrap}
.side-div{height:1px;background:rgba(255,255,255,.12);opacity:.3;margin:0 12px 4px}
.nav{flex:1;overflow-y:auto;padding:4px 8px}
.nav::-webkit-scrollbar{width:0}
.nav-group{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);padding:0 12px 3px;margin-top:16px;letter-spacing:.02em}
.nav-group:first-child{margin-top:8px}
.nav-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px 6px 0;border-radius:6px;color:var(--secondary);position:relative}
.nav-row:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav-row.sel{background:rgba(255,255,255,.08);color:var(--text)}
.nav-row .bar{width:3px;height:16px;border-radius:2px;background:transparent;flex:0 0 3px}
.nav-row.sel .bar{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.nav-row .ic{width:18px;display:flex;justify-content:center;color:var(--secondary);flex:0 0 18px}
.nav-row.sel .ic{color:var(--accent)}
.nav-row .lbl{font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-row.sel .lbl{font-weight:600}
.nav-row .badge{font-size:10px;font-weight:700;background:rgba(255,255,255,.06);color:var(--secondary);padding:1.5px 6px;border-radius:999px}
.nav-row.sel .badge{background:rgba(255,255,255,.15);color:#fff}
.nav-row .newbadge{display:flex;align-items:center;gap:3px;background:rgba(0,184,148,.12);padding:2px 5px;border-radius:999px}
.nav-row .newbadge .dot{width:6px;height:6px;border-radius:50%;background:#00B894}
.nav-row .newbadge span{font-size:8px;font-weight:800;color:#00B894}
.side-foot{padding:8px}
.side-foot .status{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.25);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--secondary);white-space:nowrap;overflow:hidden}
.side-foot .status span{overflow:hidden;text-overflow:ellipsis}
.quick-link{width:100%;text-align:left;font-size:11px;color:var(--secondary);padding:6px 8px;border-radius:6px}
.quick-link:hover{background:rgba(255,255,255,.04);color:var(--text)}
/* ============ Detail ============ */
.detail{flex:1;min-width:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.detail-inner{padding:32px;max-width:1100px}
.fade{animation:fadein .12s ease-in-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
h1.title{font-size:28px;font-weight:700;line-height:1.15}
h2.title2{font-size:18px;font-weight:600}
.headline{font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--secondary)}
.body{font-size:14px}
.callout{font-size:13px}
.cap{font-size:11px;color:var(--secondary)}
.capb{font-size:11px;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.grad-text{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
/* ============ Cards, buttons, inputs ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px}
.card-lift{transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.card-lift:hover{transform:scale(1.018);border-color:var(--accc,#6366F1);box-shadow:0 5px 16px rgba(0,0,0,.25),0 0 0 1px transparent}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:10px;padding:8px 16px;border:1px solid transparent}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{background:rgba(128,128,128,.4);color:rgba(255,255,255,.7);cursor:default;transform:none}
.btn-accent{background:var(--violet);color:#fff}
.btn-bordered{background:transparent;border-color:rgba(255,255,255,.14);color:var(--text)}
.btn-bordered:hover{background:rgba(255,255,255,.05)}
.btn-ghost{background:transparent;color:var(--violet)}
.btn-ghost:hover{background:rgba(108,92,231,.1)}
.btn-block{width:100%;justify-content:center;height:44px;font-size:14px}
.pill{display:inline-flex;align-items:center;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;white-space:nowrap}
.pill-blue{background:rgba(0,122,255,.2);color:#3A9BFF}
.pill-purple{background:rgba(139,92,246,.2);color:#B79CFF}
.pill-green{background:#00B894;color:#fff}
.pill-yellow{background:rgba(255,210,0,.2);color:var(--yellow)}
.input{background:var(--surface);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;outline:none;font-size:14px}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--tertiary)}
.searchbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px}
.searchbar input{flex:1;background:none;border:0;outline:none;font-size:14px}
.searchbar input::placeholder{color:var(--tertiary)}
.chip{font-size:11px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--surface);color:var(--text);white-space:nowrap}
.chip.sel{background:var(--accent);color:#fff;font-weight:700}
.seg{display:flex;background:var(--surface);border-radius:8px;padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:6px;font-size:13px;color:var(--secondary)}
.seg button.sel{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.switch{position:relative;width:38px;height:22px;flex:0 0 38px;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:rgba(255,255,255,.25);border-radius:999px;transition:.15s}
.switch .tr:before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked + .tr{background:var(--accent)}
.switch input:checked + .tr:before{transform:translateX(16px)}
.stepper{display:flex;align-items:center;gap:0;background:var(--surface);border-radius:8px;width:120px;justify-content:space-between}
.stepper button{width:32px;height:28px;font-size:15px;color:var(--text)}
.stepper span{font-size:14px}
.divider{height:1px;background:rgba(255,255,255,.08)}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:16px}
.dropzone{border:1px dashed rgba(255,255,255,.25);border-radius:10px;text-align:center;padding:24px 12px;color:var(--secondary)}
.dropzone.hot{border-color:var(--violet);border-width:2px;background:rgba(108,92,231,.05)}
.tintdot{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.6);cursor:pointer;flex:0 0 16px}
.tintdot.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
/* icon cells / grids */
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,140px));gap:16px;content-visibility:auto;contain-intrinsic-size:140px}
.icon-cell{background:rgba(19,21,31,.6);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.icon-cell:hover{background:var(--elevated);border-color:var(--acccb,rgba(108,92,231,.4))}
.icon-cell.sel{background:color-mix(in srgb,var(--accc,#6366F1) 18%,transparent);border:1.5px solid var(--accc,#6366F1)}
.icon-cell img{width:76px;height:76px;margin:0 auto 8px;object-fit:contain}
.icon-cell .nm{font-size:11px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-cell.sel .nm{color:var(--text)}
.icon-cell .favstar{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(19,21,31,.95);display:none;align-items:center;justify-content:center;color:var(--yellow)}
.icon-cell:hover .favstar,.icon-cell.faved .favstar{display:flex}
.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pack-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;width:100%;min-width:0}
.pack-banner{height:150px;display:flex;align-items:center;justify-content:center;gap:12px;padding:0 16px;overflow:hidden}
.pack-banner img{height:108px;max-height:108px;width:auto;max-width:calc(25% - 10px);min-width:0;flex:1 1 0;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}
.pack-info{padding:16px}
.pack-info .desc{font-size:13px;color:var(--secondary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px}
.count-pill{font-size:11px;font-weight:600;color:var(--secondary);background:rgba(255,255,255,.08);padding:4px 8px;border-radius:999px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:90vw;max-height:88vh;overflow:auto;padding:24px}
.success-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:200}
.success-card{text-align:center;padding:48px;min-width:340px}
.progress{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.progress > div{height:100%;background:var(--blue);border-radius:3px;transition:width .2s}
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px}
pre.code{background:rgba(0,0,0,.4);border-radius:6px;padding:8px 12px;font:12px ui-monospace,Menlo,monospace;color:var(--cyan1);overflow-x:auto;white-space:nowrap}
.section-label{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.row-hover:hover{background:var(--card)}
.link-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:4px 0}
.link-row:hover{opacity:.85}
</style>
<style>
/* ============ Liquid Glass + iOS polish (iOS 26 language; Glisse tokens) ============
   Glisse recipe (gitgems-unite WebUI, user-approved Nov 4): dark glass tokens,
   3px frost + saturate, specular top-edge highlight, hairline rim, press glow.
   Here the frost is stronger (20px blur + saturate 180%) for the iOS 26
   liquid-glass read, on top of the JetBlack palette — never a light theme. */
:root{
  --pad:32px;
  --spring:cubic-bezier(0.32,0.72,0,1);
  --spring-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --lg-edge:rgba(255,255,255,.09);
  --lg-specular:rgba(255,255,255,.16);
}
.detail-inner{padding:var(--pad)}
/* --- liquid glass surfaces --- */
.glass{
  background:
    radial-gradient(130% 100% at 18% 0%, rgba(255,255,255,.12), rgba(255,255,255,0) 55%),
    radial-gradient(120% 130% at 85% 115%, rgba(139,92,246,.12), rgba(255,255,255,0) 55%),
    rgba(40,40,46,.55);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--lg-edge);
  border-radius:20px;
  box-shadow:
    inset 0 1px 0 var(--lg-specular),
    inset 0 0 0 .5px rgba(255,255,255,.06),
    inset 0 -1px 0 rgba(0,0,0,.18),
    0 8px 28px rgba(0,0,0,.45);
}
/* frosted sticky bars: view headers + pack-detail bottom action bar */
.frost-bar{
  background:linear-gradient(180deg, rgba(12,14,20,.80), rgba(12,14,20,.64));
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
}
.frost-bar-bottom{
  border-bottom:0;
  border-top:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10), 0 -10px 28px rgba(0,0,0,.40);
}
.sidebar{
  background:linear-gradient(180deg, rgba(10,11,16,.88), rgba(8,9,13,.96));
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  backdrop-filter:blur(20px) saturate(160%);
  border-right:1px solid rgba(255,255,255,.07);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.04);
}
/* glass pills / badges */
.pill,.count-pill,.badge,.newbadge{
  -webkit-backdrop-filter:blur(8px) saturate(160%);
  backdrop-filter:blur(8px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.10);
}
/* rounded continuous corners */
.card{border-radius:20px;position:relative;contain:layout style paint;will-change:transform}
.pack-card{border-radius:20px;position:relative;contain:layout style paint;will-change:transform}
.icon-cell{border-radius:14px;contain:layout style paint;will-change:transform}
.input,.searchbar{border-radius:14px}
/* --- springs: view transitions, staggered entrances, press states --- */
.fade{animation:viewin .12s ease-in-out, viewrise .34s var(--spring-bounce)}
@keyframes viewin{from{opacity:0}to{opacity:1}}
@keyframes viewrise{from{transform:translateY(8px)}to{transform:translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.stagger>*{animation:rise .5s var(--spring-bounce) both;animation-delay:calc(min(var(--i,0),12)*26ms)}
.btn{transition:transform .22s var(--spring), background-color .2s ease, border-color .2s ease, box-shadow .2s ease, opacity .2s ease}
.btn:active{transform:scale(.96)}
.card-lift{transition:transform .28s var(--spring), border-color .28s ease, box-shadow .28s ease;overflow:hidden}
.card-lift:hover{transform:scale(1.018)}
.card-lift::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.09) 50%,transparent 58%);transform:translateX(-130%);transition:transform .8s var(--spring);opacity:0}
.card-lift:hover::before{opacity:1;transform:translateX(130%)}
/* cursor-tracked specular highlight on glass cards (pointer position via JS) */
.card::after,.pack-card::after,.icon-cell::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.09), rgba(255,255,255,0) 65%);
  opacity:0;transition:opacity .3s ease;
}
.card:hover::after,.pack-card:hover::after,.icon-cell:hover::after{opacity:1}
/* skeleton shimmer + thumbnail fade-in */
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.icon-cell:not(.cell-loaded)::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%);
  background-size:200% 100%;animation:shimmer 1.6s linear infinite;
}
.icon-cell.cell-loaded::before{display:none}
.icon-cell img,.pack-banner img{opacity:0;transition:opacity .35s ease}
.icon-cell img.img-in,.pack-banner img.img-in{opacity:1}
/* sidebar rows: gradient bar slides in */
.nav-row{transition:background .2s ease, color .2s ease, transform .18s var(--spring)}
.nav-row:active{transform:scale(.97)}
.nav-row .bar{transition:transform .3s var(--spring), background .2s ease, opacity .2s ease;transform:translateX(-4px);opacity:0}
.nav-row.sel .bar{transform:translateX(0);opacity:1}
/* --- iOS toggle switches (pill track + sliding knob, accent fill) --- */
.switch{width:51px;height:31px;flex:0 0 51px}
.switch .tr{background:rgba(120,120,128,.36);transition:background .3s var(--spring);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08)}
.switch .tr:before{width:27px;height:27px;left:2px;top:2px;box-shadow:0 2px 6px rgba(0,0,0,.4), 0 0 0 .5px rgba(0,0,0,.08);transition:transform .3s var(--spring-bounce)}
.switch input:checked + .tr{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.switch input:checked + .tr:before{transform:translateX(20px)}
.switch:active .tr:before{transform:scaleX(1.08)}
.switch input:checked:active + .tr:before{transform:translateX(20px) scaleX(1.08)}
/* --- iOS segmented control with sliding frosted indicator --- */
.seg{position:relative}
.seg-thumb{
  position:absolute;top:2px;bottom:2px;border-radius:6px;pointer-events:none;z-index:0;
  background:rgba(255,255,255,.14);
  -webkit-backdrop-filter:blur(8px) saturate(160%);
  backdrop-filter:blur(8px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.10), 0 1px 4px rgba(0,0,0,.35);
  transition:left .32s var(--spring), width .32s var(--spring), opacity .2s ease;
}
.seg button{position:relative;z-index:1}
.seg button.sel{background:transparent}
.packs-seg{width:170px;flex:0 0 170px}
/* --- iOS sheets: slide up from bottom, drag handle, dimmed backdrop --- */
.modal-overlay{align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:fadein .22s ease}
.modal-overlay.closing{animation:fadeout .22s var(--spring) forwards}
.modal-overlay.closing .modal{animation:sheetdown .22s var(--spring) forwards}
.modal{
  position:relative;width:min(640px,100%);max-width:100%;max-height:86vh;
  border-radius:24px 24px 0 0;padding-top:32px;
  background:
    radial-gradient(130% 100% at 18% 0%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%),
    var(--card);
  border:1px solid rgba(255,255,255,.12);border-bottom:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 -12px 40px rgba(0,0,0,.5);
  animation:sheetup .4s var(--spring-bounce);
}
.modal::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
@keyframes sheetup{from{transform:translateY(64px);opacity:.5}to{transform:translateY(0);opacity:1}}
@keyframes sheetdown{to{transform:translateY(64px);opacity:0}}
@keyframes fadeout{to{opacity:0}}
.success-card{animation:pop .45s var(--spring-bounce)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* progress + scroll frost edge */
.progress > div{background:linear-gradient(90deg,var(--blue),#5AA9FF);transition:width .35s var(--spring)}
.detail{transition:box-shadow .3s ease}
.detail.scrolled{box-shadow:inset 0 26px 26px -26px rgba(0,0,0,.7)}
/* layout helpers for responsive stacking */
.qa-row{display:flex}
.home-packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.apply-cols{display:flex;align-items:flex-start}
.batch-cols{display:flex;align-items:flex-start}
/* --- iOS floating glass tab bar (phone only) --- */
.tabbar{display:none}
@media (max-width:700px){
  :root{--pad:16px}
  .sidebar{display:none}
  .detail{padding-bottom:96px}
  .detail-inner{max-width:none}
  h1.title{font-size:26px}
  .pack-grid{grid-template-columns:1fr}
  .icon-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
  .icon-cell img{width:56px;height:56px}

function hexA(hex, a){
  const h = String(hex||"#6366F1").replace("#","");
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
function packGrad(hex){ return `linear-gradient(135deg, ${hexA(hex,.75)}, ${hexA(hex,.25)})`; }

async function api(method, path, body){
  const r = await fetch(path, {method, headers:{"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
  return r.json();
}
function cap(s){ return String(s||"").replace(/(^|[\s-])\S/g, c => c.toUpperCase()); }
function displayName(path){ const p = String(path||"").replace(/\/+$/,""); return p.split("/").pop() || p; }
function parentPath(path){ const p = String(path||"").replace(/\/+$/,""); const i = p.lastIndexOf("/"); return i > 0 ? p.slice(0,i) : "/"; }

  "home":{nav:"Home", icon:"house.fill"},
  "packs":{nav:"Icon Packs", icon:"square.grid.3x3.fill"},
  "favorites":{nav:"Favorites", icon:"star.fill"},
  "apply":{nav:"Apply Icon", icon:"folder.badge.plus"},

  "about":{nav:"About", icon:"info.circle.fill"},

};
function curRoute(){
  const h = location.hash.replace(/^#\/?/, "");
  const [name, arg] = h.split("/");
  return {name: ROUTES[name] ? name : "home", arg: arg || null};
}
function go(route){ location.hash = "#/" + route; }
async function refresh(){
  try { S = await (await fetch("/api/state")).json(); } catch(e){ S = S || {packs:[], favorites:[], settings:{}, recents:[], statusMessage:""}; }

}

  if(!S) return;

  const row = (key, shortcut) => {
    const r = ROUTES[key];

    if(key === "favorites" && favN > 0) badge = `<span class="badge">${favN}</span>`;
    if(key === "updates" && S.updateAvailable) badge = `<span class="newbadge"><span class="dot"></span><span>NEW</span></span>`;

function openBrowseModal(opts){
  // opts: {title, multi, onPick(paths), onPickOne(path)}
  let cur = opts.start || (S && S.recents && S.recents[0] ? parentPath(S.recents[0]) : "");
  const picked = new Set();
  const draw = async () => {
    const d = await api("POST", "/api/browse", {dir: cur});
    const rows = d.entries.map(e => {
      const on = picked.has(e.path);
      return `<div class="row-hover" style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer" data-path="${esc(e.path)}">
        ${opts.multi ? `<input type="checkbox" ${on?"checked":""} data-ck="${esc(e.path)}" style="accent-color:var(--accent)">` : ""}
        <span style="color:var(--accent)">${ic("folder.fill",16)}</span>
        <span class="body">${esc(e.name)}</span>
        <span class="cap" style="margin-left:auto">${esc(e.path)}</span></div>`;
    }).join("");
    openModal(`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div><div class="title2">${esc(opts.title||"Choose Folder")}</div><div class="cap">${esc(d.current)}</div></div>
        <div style="margin-left:auto;display:flex;gap:8px">
          ${d.parent ? `<button class="btn btn-bordered" id="br-up">↑ Parent</button>` : ""}
          <button class="btn btn-bordered" id="br-home">Home</button>
        </div>
      </div>
      <div style="max-height:340px;overflow-y:auto">${rows || '<div class="cap" style="padding:24px;text-align:center">No subfolders here.</div>'}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
        <button class="btn btn-bordered" id="br-cancel">Cancel</button>
        ${opts.multi ? `<button class="btn btn-primary" id="br-add">Add Selected</button>` : ""}
        <button class="btn btn-primary" id="br-this">Use This Folder</button>
      </div>`, 560);
    $("#br-cancel").addEventListener("click", closeModal);
    $("#br-home").addEventListener("click", () => { cur = d.home; draw(); });
    const up = $("#br-up"); if(up) up.addEventListener("click", () => { cur = d.parent; draw(); });
    document.querySelectorAll("[data-path]").forEach(rowEl => rowEl.addEventListener("click", e => {
      if(e.target.tagName === "INPUT") return;
      cur = rowEl.dataset.path; draw();
    }));
    document.querySelectorAll("[data-ck]").forEach(cb => cb.addEventListener("click", e => {
      e.stopPropagation();
      if(cb.checked) picked.add(cb.dataset.ck); else picked.delete(cb.dataset.ck);
    }));
    const addBtn = $("#br-add"); if(addBtn) addBtn.addEventListener("click", () => { closeModal(); opts.onPick([...picked]); });
    $("#br-this").addEventListener("click", () => { closeModal(); opts.multi ? opts.onPick([cur]) : opts.onPickOne(cur); });
  };
  draw();
}

function exportMenu(anchorBtn, iconId, tint){

  pop.id = "export-pop";
  pop.style.cssText = `position:fixed;z-index:150;left:${r.left}px;top:${r.bottom+4}px;background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.5)`;
  pop.innerHTML = [
    ["png","Export PNG (1024×1024)...","photo"],
    ["icns","Export macOS Icon (.icns)...","app.fill"],
    ["svg","Export Original Vector (.svg)...","square.and.arrow.up"],
  ].map(([f,l,icn]) => `<button class="link-row" data-f="${f}" style="padding:8px;border-radius:6px"><span style="color:var(--secondary)">${ic(icn,14)}</span><span class="body">${l}</span></button>`).join("");
  document.body.appendChild(pop);
  pop.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    pop.remove();
    const a = document.createElement("a");
    a.href = `/api/export?id=${encodeURIComponent(iconId)}&format=${b.dataset.f}${tint ? "&tint="+encodeURIComponent(tint) : ""}`;

  }));
  const off = e => { if(!pop.contains(e.target) && e.target !== anchorBtn){ pop.remove(); document.removeEventListener("click", off); } };

}

function tintHue(hex){
  // Rough hue rotation for the live tint preview (server applies the real tint).
  const h = hex.replace("#",""); const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b); let hue = 0;
  if(mx !== mn){ const d = mx - mn;
    if(mx === r) hue = ((g - b) / d) % 6; else if(mx === g) hue = (b - r) / d + 2; else hue = (r - g) / d + 4;
    hue = Math.round(hue * 60); if(hue < 0) hue += 360; }
  return hue - 220;
}

      <input id="cf-name" class="input" placeholder="Folder name" style="width:300px;margin-top:24px">

  const ex = $("#apply-export");

    if(!r.ok) showAlert("Error", r.error || "Reset failed", "OK");
    await refresh();
  });
  const doBtn = $("#apply-do");
  if(doBtn) doBtn.addEventListener("click", async () => {
    const r = await api("POST", "/api/apply", {icon_id: icon.id, folder, name: V.applyName || displayName(folder), tint: V.applyTintOn ? V.applyTint : ""});

  });
};

VIEWS.builderBind = () => {

  }));
  $("#quick-quit").addEventListener("click", () => {
    showAlert("Quit MCons", "Close this browser tab to quit. The local server keeps running at http://127.0.0.1:8795/ until you stop it.", "OK");
  });
};
/* ================= boot ================= */
let lastRoute = "home";
window.addEventListener("hashchange", () => {
  const r = curRoute();
  if(r.name !== lastRoute){
    V = {}; // view-local state resets on navigation, like Swift's fresh @State
    V.prevRoute = lastRoute;
    lastRoute = r.name;
  }
  renderSidebar();
  renderView(false);
});
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if(mod && !inField){
    const map = {"1":"home","2":"packs","3":"favorites","4":"apply","5":"batch","6":"builder",",":"settings","i":"about"};
    if(map[e.key]){ e.preventDefault(); go(map[e.key]); }
    if(e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); api("POST","/api/undo",{}).then(refresh); }
    if((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y"){ e.preventDefault(); api("POST","/api/redo",{}).then(refresh); }
  }
});
/* pointer-tracked specular highlight on glass cards (rAF-throttled, scroll-paused) */
let shineRaf = 0;
let isScrolling = false, scrollTimer = 0;
document.addEventListener("pointermove", e => {
  if(isScrolling) return;
  const el = e.target.closest && e.target.closest(".card, .pack-card, .icon-cell");
  if(!el || shineRaf) return;
  shineRaf = requestAnimationFrame(() => {
    shineRaf = 0;
    const r = el.getBoundingClientRect();
    el.style.setProperty("--mx", Math.round(e.clientX - r.left) + "px");
    el.style.setProperty("--my", Math.round(e.clientY - r.top) + "px");
  });
}, {passive:true});
/* thumbnail fade-in + shimmer stop, once each image actually loads */
document.addEventListener("load", e => {
  if(e.target && e.target.tagName === "IMG"){
    e.target.classList.add("img-in");
    const cell = e.target.closest(".icon-cell");
    if(cell) cell.classList.add("cell-loaded");
  }
}, true);
document.addEventListener("error", e => {
  if(e.target && e.target.tagName === "IMG") e.target.classList.add("img-in");
}, true);
/* frosted top edge once the detail column scrolls */
const detailEl = document.getElementById("detail");
detailEl.addEventListener("scroll", () => {
  isScrolling = true;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => { isScrolling = false; }, 120);
  detailEl.classList.toggle("scrolled", detailEl.scrollTop > 8);
}, {passive:true});
(async () => {
  await refresh();
  // Silent update check on launch, like Swift's UpdaterView.onAppear.
  try { await fetch("/api/update/check"); await refresh(); } catch(e){}
})();
</script>
</body>
