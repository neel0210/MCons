    <g transform="translate(332, 370) scale(0.70)">
      <path d="M374 485 L477 395 C492 382 500 363 500 343 L500 157 C500 137 492 118 477 105 L374 15 C364 6 350 4 338 10 C326 16 319 28 319 41 L319 123 L144 260 L23 166 C13 158 0 162 0 174 L0 326 C0 338 13 342 23 334 L144 240 L319 377 L319 459 C319 472 326 484 338 490 C350 496 364 494 374 485 Z" fill="#0065A9"/>
      <path d="M477 105 L374 15 C364 6 350 4 338 10 C326 16 319 28 319 41 L319 250 L477 105 Z" fill="#007ACC"/>
      <path d="M374 485 L477 395 C492 382 500 363 500 343 L500 340 L319 250 L319 459 C319 472 326 484 338 490 C350 496 364 494 374 485 Z" fill="#1F9CF0"/>
      <path d="M319 250 L144 113 L23 166 C13 158 0 162 0 174 L0 326 C0 338 13 342 23 334 L144 387 L319 250 Z" fill="#005B9E"/>
