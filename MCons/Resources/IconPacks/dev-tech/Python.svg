    <rect x="76" y="220" width="872" height="660" rx="42" fill="url(#folderGrad)"/>
    <!-- Subtle Top Rim Highlight -->
    <path d="M 118 221 L 906 221" stroke="#FFD43B" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  </g>

