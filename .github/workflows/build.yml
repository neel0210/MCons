name: Build & Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Test Build (Beta)'
        type: choice
        options:
          - 'Test Build (Beta)'
          - 'Production Build'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build MCons App Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh

      - name: Create Zip Archive
        run: |
          if [ ! -d "output/MCons.app" ]; then
            echo "❌ output/MCons.app directory does not exist!"
            exit 1
          fi
          cd output
          zip -r MCons.app.zip MCons.app
          cd ..
          echo "Output directory listing:"
          ls -lh output/

      - name: Extract Build Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LAST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an)")
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "last_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT

      # --- TEST BUILD (BETA) ---
      - name: Send Beta Build to Telegram Channel
        if: ${{ inputs.build_type == 'Test Build (Beta)' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          FILE_PATH="output/MCons.app.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }

          # Write caption to a temp file to avoid newline issues in curl multipart
          cat > /tmp/caption.txt << 'CAPTION_END'
          Beta Build ⚡
          CAPTION_END
          printf "Beta Build ⚡\nDate: %s\nLast Commit: %s" \
            "${{ steps.meta.outputs.date }}" \
            "${{ steps.meta.outputs.last_commit }}" > /tmp/caption.txt

          RESPONSE=$(curl -s --max-time 120 \
               -F chat_id="${CHANNEL_ID}" \
               -F "document=@${FILE_PATH}" \
               -F "caption=</tmp/caption.txt" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument") || true
          echo "Telegram Response: ${RESPONSE}"
          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Beta Build sent to Telegram!"
          else
            echo "❌ Failed to send Beta Build to Telegram!"
            exit 1
          fi

      # --- PRODUCTION BUILD ---
      - name: Create GitHub Release
        if: ${{ inputs.build_type == 'Production Build' }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MCons Production Release v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: output/MCons.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Production Build to Telegram Channel
        if: ${{ inputs.build_type == 'Production Build' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          FILE_PATH="output/MCons.app.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }

          printf "🚀 Production Build v1.0.${{ github.run_number }}\nDate: %s\nLast Commit: %s\n\nRelease Notes: %s" \
            "${{ steps.meta.outputs.date }}" \
            "${{ steps.meta.outputs.last_commit }}" \
            "${RELEASE_URL}" > /tmp/caption.txt

          RESPONSE=$(curl -s --max-time 120 \
               -F chat_id="${CHANNEL_ID}" \
               -F "document=@${FILE_PATH}" \
               -F "caption=</tmp/caption.txt" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument") || true
          echo "Telegram Response: ${RESPONSE}"
          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Production Build sent to Telegram!"
          else
            echo "❌ Failed to send Production Build to Telegram!"
            exit 1
          fi

      # --- FAILURE NOTIFICATION ---
      - name: Send Error Notification to Telegram Group
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf "⚠️ MCons Build Failed!\nBuild Type: %s\nTriggered by: %s\nRun URL: %s/%s/actions/runs/%s" \
            "${{ inputs.build_type }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" > /tmp/error_text.txt

          curl -s --max-time 30 \
            -F chat_id="${CHAT_ID}" \
            -F "text=</tmp/error_text.txt" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" || true
