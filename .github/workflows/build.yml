name: Build & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Test Build (Beta)'
        type: choice
        options:
          - 'Test Build (Beta)'
          - 'Production Build'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build MCons App Bundle
        run: |
          chmod +x build.sh
          ./build.sh --zip --dmg

      - name: Verify Build Output
        run: |
          ZIP_FILE=$(ls output/MCons-*-release.zip 2>/dev/null | head -1 || true)
          DMG_FILE=$(ls output/MCons-*-release.dmg output/MCons.dmg 2>/dev/null | head -1 || true)
          if [ -z "${ZIP_FILE}" ] || [ ! -f "${ZIP_FILE}" ]; then
            echo "❌ Zip archive not found!"
            ls -lh output/
            exit 1
          fi
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "❌ DMG file not found!"
            ls -lh output/
            exit 1
          fi
          echo "Output directory listing:"
          ls -lh output/

      - name: Extract Build Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LAST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an)")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ inputs.build_type }}" == "Production Build" ]]; then
            TAG="v1.0.4.${{ github.run_number }}"
          else
            TAG="beta-v1.0.4.${{ github.run_number }}"
          fi
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "last_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # --- TEST BUILD (BETA) ---
      - name: Create GitHub Beta Pre-Release
        if: ${{ inputs.build_type == 'Test Build (Beta)' && !startsWith(github.ref, 'refs/tags/v') }}
        id: create_beta_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MCons Beta Build ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            ### 💿 Install via Disk Image (.dmg) — Recommended

            1. Download **`MCons.dmg`** below.
            2. Double-click to mount the `.dmg` disk image.
            3. Drag **MCons.app** into the **Applications** folder shortcut.
            4. **First Launch (macOS Gatekeeper)**:
               - **Easiest:** Double-click `Open_MCons.command` inside the DMG.
               - **Manual:** Right-click `MCons.app` in `/Applications` → click **Open** → click **Open**.
               - **Terminal:** Run `xattr -cr /Applications/MCons.app`

            ---

            ### ⚡ 1-Line Terminal Quick Install (macOS 14.0+)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash
            ```

            ---

            ### 🍺 Homebrew Cask
            ```bash
            brew install --cask neel0210/mcons/mcons
            ```
          files: |
            output/MCons.dmg
            output/MCons-*-release.dmg
            output/MCons-*-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Beta Build to Telegram Channel
        if: ${{ inputs.build_type == 'Test Build (Beta)' && !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_beta_release.outputs.url }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHANNEL_ID}" ]; then
            echo "⚠️ Telegram secrets (TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID) not configured. Skipping."
            exit 0
          fi

          DMG_FILE=$(ls output/MCons-*-release.dmg output/MCons.dmg 2>/dev/null | head -1 || true)
          DMG_SIZE=$(du -sh "${DMG_FILE}" | awk '{print $1}')

          TEXT="⚡ <b>MCons Beta Build ${{ steps.meta.outputs.tag }}</b> (DMG: ${DMG_SIZE})\n\n📅 <b>Date:</b> ${{ steps.meta.outputs.date }}\n🔖 <b>Last Commit:</b> ${{ steps.meta.outputs.last_commit }}\n\n💿 <b>Download Mac DMG:</b> <a href=\"${RELEASE_URL}\">MCons.dmg</a>\n\n📋 <b>Installer Instructions:</b>\n1. Mount DMG & drag MCons to Applications\n2. First launch: Right-click > Open (or run: <code>xattr -cr /Applications/MCons.app</code>)\n\n🚀 <b>1-Line Terminal Install:</b>\n<code>curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash</code>\n\n🔗 <b>Release Page:</b> <a href=\"${RELEASE_URL}\">${RELEASE_URL}</a>"

          RESPONSE=$(curl -sS --max-time 30 \
               --form-string "chat_id=${CHANNEL_ID}" \
               --form-string "parse_mode=HTML" \
               --form-string "text=$(echo -e "${TEXT}")" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"

          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Beta notification sent to Telegram!"
          else
            echo "⚠️ Failed to send Telegram notification (check bot token): ${RESPONSE}"
          fi

      # --- PRODUCTION BUILD ---
      - name: Create GitHub Release
        if: ${{ inputs.build_type == 'Production Build' || startsWith(github.ref, 'refs/tags/v') }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MCons Production Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ### 💿 Install via Disk Image (.dmg) — Recommended

            1. Download **`MCons.dmg`** below.
            2. Double-click to mount the `.dmg` disk image.
            3. Drag **MCons.app** into the **Applications** folder shortcut.
            4. **First Launch (macOS Gatekeeper)**:
               - **Easiest:** Double-click `Open_MCons.command` inside the DMG.
               - **Manual:** Right-click `MCons.app` in `/Applications` → click **Open** → click **Open**.
               - **Terminal:** Run `xattr -cr /Applications/MCons.app`

            ---

            ### ⚡ 1-Line Terminal Quick Install (macOS 14.0+)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash
            ```

            ---

            ### 🍺 Homebrew Cask
            ```bash
            brew install --cask neel0210/mcons/mcons
            ```
          files: |
            output/MCons.dmg
            output/MCons-*-release.dmg
            output/MCons-*-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Production Build to Telegram Channel
        if: ${{ inputs.build_type == 'Production Build' || startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHANNEL_ID}" ]; then
            echo "⚠️ Telegram secrets (TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL_ID) not configured. Skipping."
            exit 0
          fi

          DMG_FILE=$(ls output/MCons-*-release.dmg output/MCons.dmg 2>/dev/null | head -1 || true)
          DMG_SIZE=$(du -sh "${DMG_FILE}" | awk '{print $1}')

          TEXT="🚀 <b>MCons Production Release ${{ steps.meta.outputs.tag }}</b> (DMG: ${DMG_SIZE})\n\n📅 <b>Date:</b> ${{ steps.meta.outputs.date }}\n🔖 <b>Last Commit:</b> ${{ steps.meta.outputs.last_commit }}\n\n💿 <b>Download Mac DMG:</b> <a href=\"${RELEASE_URL}\">MCons.dmg</a>\n\n📋 <b>Installer Instructions:</b>\n1. Mount DMG & drag MCons to Applications\n2. First launch: Right-click > Open (or run: <code>xattr -cr /Applications/MCons.app</code>)\n\n🚀 <b>1-Line Terminal Install:</b>\n<code>curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash</code>\n\n🔗 <b>Release Page:</b> <a href=\"${RELEASE_URL}\">${RELEASE_URL}</a>"

          RESPONSE=$(curl -sS --max-time 30 \
               --form-string "chat_id=${CHANNEL_ID}" \
               --form-string "parse_mode=HTML" \
               --form-string "text=$(echo -e "${TEXT}")" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"

          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Production notification sent to Telegram!"
          else
            echo "⚠️ Failed to send Telegram notification (check bot token): ${RESPONSE}"
          fi

      # --- FAILURE NOTIFICATION ---
      - name: Send Error Notification to Telegram Group
        if: failure()
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${BOT_TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            exit 0
          fi
          printf "⚠️ MCons Build Failed!\nBuild Type: %s\nTriggered by: %s\nRun URL: %s/%s/actions/runs/%s" \
            "${{ inputs.build_type }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" > /tmp/error_text.txt

          RESPONSE=$(curl -sS --max-time 30 \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "text=$(cat /tmp/error_text.txt)" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1 || true)
          echo "Telegram Raw Output: ${RESPONSE}"
