name: Build & Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Test Build (Beta)'
        type: choice
        options:
          - 'Test Build (Beta)'
          - 'Production Build'

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build MCons macOS Bundle
        run: |
          chmod +x build.sh
          ./build.sh --zip --dmg

      - name: Verify macOS Output
        run: |
          ZIP_FILE=$(ls output/MCons-*-release.zip 2>/dev/null | head -1 || true)
          DMG_FILE=$(ls output/MCons-*-release.dmg output/MCons.dmg 2>/dev/null | head -1 || true)
          if [ -z "${ZIP_FILE}" ] || [ ! -f "${ZIP_FILE}" ]; then
            echo "❌ Zip archive not found!"
            ls -lh output/
            exit 1
          fi
          if [ -z "${DMG_FILE}" ] || [ ! -f "${DMG_FILE}" ]; then
            echo "❌ DMG file not found!"
            ls -lh output/
            exit 1
          fi
          ls -lh output/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcons-macos
          path: |
            output/MCons.dmg
            output/MCons-*-release.dmg
            output/MCons-*-release.zip
          retention-days: 7

  build-windows:
    name: Build Windows App & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Windows Standalone EXE & Installer
        run: |
          python windows/build_exe.py

      - name: Verify Windows Output
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/dist/MCons-Windows.exe")) {
            Write-Error "MCons-Windows.exe not found!"
          }
          if (-not (Test-Path "windows/dist/MCons-Windows-Setup.exe")) {
            Write-Error "MCons-Windows-Setup.exe not found!"
          }
          Get-ChildItem -Path windows/dist

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcons-windows
          path: |
            windows/dist/MCons-Windows-Setup.exe
            windows/dist/MCons-Windows.exe
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mcons-macos
          path: release-assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mcons-windows
          path: release-assets/

      - name: Extract Build Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LAST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an)")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ inputs.build_type }}" == "Production Build" ]]; then
            TAG="v1.0.4.${{ github.run_number }}"
          else
            TAG="beta-v1.0.4.${{ github.run_number }}"
          fi
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "last_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # --- TEST BUILD (BETA) ---
      - name: Create GitHub Beta Pre-Release
        if: ${{ inputs.build_type == 'Test Build (Beta)' && !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MCons Beta Build ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            ## 🪟 Windows 10 & 11 Installation
            
            - **Installer (Recommended):** Download and run **`MCons-Windows-Setup.exe`**. Includes automatic Start Menu shortcut, Desktop shortcut, and Windows Explorer right-click context menu integration (*"Customize with MCons"*).
            - **Standalone Executable:** Download **`MCons-Windows.exe`** for instant portable use without installation.

            ---

            ## 🍎 macOS Installation (macOS 14.0+)
            
            1. Download **`MCons.dmg`** below.
            2. Double-click to mount the `.dmg` disk image.
            3. Drag **MCons.app** into the **Applications** folder shortcut.
            4. **Gatekeeper:** Right-click `MCons.app` in `/Applications` → click **Open** → click **Open**, or run `xattr -cr /Applications/MCons.app`.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- PRODUCTION BUILD ---
      - name: Create GitHub Release
        if: ${{ inputs.build_type == 'Production Build' || startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MCons Production Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 🪟 Windows 10 & 11 Installation
            
            - **Installer (Recommended):** Download and run **`MCons-Windows-Setup.exe`**. Includes automatic Start Menu shortcut, Desktop shortcut, and Windows Explorer right-click context menu integration (*"Customize with MCons"*).
            - **Standalone Executable:** Download **`MCons-Windows.exe`** for instant portable use without installation.

            ---

            ## 🍎 macOS Installation (macOS 14.0+)
            
            1. Download **`MCons.dmg`** below.
            2. Double-click to mount the `.dmg` disk image.
            3. Drag **MCons.app** into the **Applications** folder shortcut.
            4. **Gatekeeper:** Right-click `MCons.app` in `/Applications` → click **Open** → click **Open**, or run `xattr -cr /Applications/MCons.app`.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
