name: Build & Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Test Build (Beta)'
        type: choice
        options:
          - 'Test Build (Beta)'
          - 'Production Build'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build MCons App Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh --zip

      - name: Verify Build Output
        run: |
          if [ ! -f "output/MCons-v1.0.2-release.zip" ]; then
            echo "❌ Zip archive not found!"
            ls -lh output/
            exit 1
          fi
          echo "Output directory listing:"
          ls -lh output/

      - name: Extract Build Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LAST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an)")
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "last_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT

      # --- TEST BUILD (BETA) ---
      - name: Send Beta Build to Telegram Channel
        if: ${{ inputs.build_type == 'Test Build (Beta)' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          FILE_PATH="output/MCons-v1.0.2-release.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }

          printf "Beta Build ⚡\nDate: %s\nLast Commit: %s" \
            "${{ steps.meta.outputs.date }}" \
            "${{ steps.meta.outputs.last_commit }}" > /tmp/caption.txt

          echo "Sending file to Telegram..."
          RESPONSE=$(curl -sS --max-time 120 \
               --form-string "chat_id=${CHANNEL_ID}" \
               -F "document=@${FILE_PATH}" \
               --form-string "caption=$(cat /tmp/caption.txt)" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" 2>&1)
          
          echo "Telegram Raw Output: ${RESPONSE}"
          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Beta Build sent to Telegram!"
          else
            echo "❌ Failed to send Beta Build to Telegram!"
            exit 1
          fi

      # --- PRODUCTION BUILD ---
      - name: Create GitHub Release
        if: ${{ inputs.build_type == 'Production Build' }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2.${{ github.run_number }}
          name: MCons Production Release v1.0.2.${{ github.run_number }}
          generate_release_notes: true
          files: output/MCons-v1.0.2-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Production Build to Telegram Channel
        if: ${{ inputs.build_type == 'Production Build' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          FILE_PATH="output/MCons-v1.0.2-release.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }

          printf "🚀 Production Build v1.0.2.${{ github.run_number }}\nDate: %s\nLast Commit: %s\n\nRelease Notes: %s" \
            "${{ steps.meta.outputs.date }}" \
            "${{ steps.meta.outputs.last_commit }}" \
            "${RELEASE_URL}" > /tmp/caption.txt

          echo "Sending file to Telegram..."
          RESPONSE=$(curl -sS --max-time 120 \
               --form-string "chat_id=${CHANNEL_ID}" \
               -F "document=@${FILE_PATH}" \
               --form-string "caption=$(cat /tmp/caption.txt)" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" 2>&1)
          
          echo "Telegram Raw Output: ${RESPONSE}"
          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Production Build sent to Telegram!"
          else
            echo "❌ Failed to send Production Build to Telegram!"
            exit 1
          fi

      # --- FAILURE NOTIFICATION ---
      - name: Send Error Notification to Telegram Group
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf "⚠️ MCons Build Failed!\nBuild Type: %s\nTriggered by: %s\nRun URL: %s/%s/actions/runs/%s" \
            "${{ inputs.build_type }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" > /tmp/error_text.txt

          RESPONSE=$(curl -sS --max-time 30 \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "text=$(cat /tmp/error_text.txt)" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"
