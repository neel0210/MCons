name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish Release to GitHub Releases?'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.0.0, or leave empty for auto v<version>)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as Pre-release / Beta?'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace

  build-macos:
    name: Build macOS (Universal)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-macos-universal-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-universal-

      - name: Build Universal Binaries
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../dist-macos
          lipo -create -output ../dist-macos/mcons target/aarch64-apple-darwin/release/mcons target/x86_64-apple-darwin/release/mcons
          lipo -create -output ../dist-macos/mcons-app target/aarch64-apple-darwin/release/mcons-app target/x86_64-apple-darwin/release/mcons-app
          strip ../dist-macos/mcons ../dist-macos/mcons-app

      - name: Create macOS App Bundle, DMG & ZIP
        run: |
          BUNDLE=dist-macos/MCons.app/Contents
          mkdir -p "$BUNDLE/MacOS" "$BUNDLE/Resources"
          cp dist-macos/mcons-app "$BUNDLE/MacOS/"

          VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          cat > "$BUNDLE/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>mcons-app</string>
            <key>CFBundleIdentifier</key><string>com.neel0210.mcons</string>
            <key>CFBundleName</key><string>MCons</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          cp -R MCons/Resources/IconPacks "$BUNDLE/Resources/" 2>/dev/null || true
          if [ -f MCons/Resources/AppIcon.icns ]; then
            cp MCons/Resources/AppIcon.icns "$BUNDLE/Resources/AppIcon.icns"
          fi

          codesign --force --deep --sign - dist-macos/MCons.app

          ditto -c -k --sequesterRsrc --keepParent dist-macos/MCons.app dist-macos/MCons-release.zip

          STAGING=$(mktemp -d)
          cp -R dist-macos/MCons.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname MCons -srcfolder "$STAGING" -ov -format UDZO dist-macos/MCons.dmg
          rm -rf "$STAGING"

          mkdir -p release-macos
          cp dist-macos/MCons.dmg release-macos/
          cp dist-macos/MCons-release.zip release-macos/
          cp dist-macos/mcons release-macos/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: release-macos
          path: release-macos/*
          retention-days: 1

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Windows Portable ZIP
        shell: pwsh
        run: |
          mkdir dist\IconPacks -Force
          cp rust/target/x86_64-pc-windows-msvc/release/mcons.exe dist/
          cp rust/target/x86_64-pc-windows-msvc/release/mcons-app.exe dist/
          cp -r MCons/Resources/IconPacks dist/
          mkdir release-windows -Force
          Compress-Archive -Path dist/* -DestinationPath release-windows/MCons-windows-x64.zip
          cp rust/target/x86_64-pc-windows-msvc/release/mcons.exe release-windows/mcons.exe
          cp rust/target/x86_64-pc-windows-msvc/release/mcons-app.exe release-windows/mcons-app.exe

      - name: Build MSI Installer
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool install --global wix || true
          wix eula accept wix7 2>$null || true
          wix build -acceptEula wix7 -o release-windows/MCons-Setup.msi rust/wix/main.wxs || true

      - name: Build Portable Single-File EXE (NSIS)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install nsis -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            $makensis = "makensis"
          }
          mkdir rust/output -Force
          mkdir rust/staging -Force
          cp dist/* rust/staging/ -Recurse -Force
          & $makensis rust/nsis/portable.nsi
          if (Test-Path rust/output/MCons.exe) {
            cp rust/output/MCons.exe release-windows/MCons.exe
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: release-windows
          path: release-windows/*
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.release == true || inputs.release == 'true')) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: release-assets/

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets/

      - name: Publish Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            TAG="v${VERSION}"
          fi

          echo "Publishing release $TAG with assets:"
          ls -lh release-assets/

          PRERELEASE_FLAG=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          NOTES="## 🚀 MCons Release $TAG"$'\n\n'
          NOTES+="- **macOS**: \`MCons.dmg\`, \`MCons-release.zip\`, \`mcons\` (Universal)"$'\n'
          NOTES+="- **Windows**: \`MCons-Setup.msi\`, \`MCons-windows-x64.zip\`, \`mcons.exe\`, \`mcons-app.exe\`"$'\n\n'
          NOTES+="*Built automatically via GitHub Actions.*"

          gh release create "$TAG" release-assets/* \
            --title "MCons $TAG" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG || gh release upload "$TAG" release-assets/* --clobber
