name: Build & Package

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Test Build (Beta)'
        type: choice
        options:
          - 'Test Build (Beta)'
          - 'Production Build'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build MCons App Bundle
        run: |
          chmod +x build_app.sh
          ./build_app.sh --zip

      - name: Verify Build Output
        run: |
          ZIP_FILE=$(ls output/MCons-*-release.zip 2>/dev/null | head -1 || true)
          if [ -z "${ZIP_FILE}" ] || [ ! -f "${ZIP_FILE}" ]; then
            echo "❌ Zip archive not found!"
            ls -lh output/
            exit 1
          fi
          echo "Output directory listing:"
          ls -lh output/

      - name: Extract Build Metadata
        id: meta
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          LAST_COMMIT=$(git log -1 --pretty=format:"%h - %s (%an)")
          echo "date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "last_commit=${LAST_COMMIT}" >> $GITHUB_OUTPUT

      # --- TEST BUILD (BETA) ---
      - name: Create GitHub Beta Pre-Release
        if: ${{ inputs.build_type == 'Test Build (Beta)' }}
        id: create_beta_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-v1.0.3.${{ github.run_number }}
          name: MCons Beta Build v1.0.3.${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          body: |
            ### ⚡ Quick Install (macOS 14.0+)

            > [!WARNING]
            > **Direct `.zip` browser downloads will be blocked by macOS Gatekeeper.**
            > **Please install / update only via this 1-line command in Terminal:**

            ```bash
            curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash
            ```
          files: output/MCons-v1.0.3-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Beta Build to Telegram Channel
        if: ${{ inputs.build_type == 'Test Build (Beta)' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_beta_release.outputs.url }}
        run: |
          FILE_PATH="output/MCons-v1.0.3-release.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }
          FILE_SIZE=$(wc -c < "${FILE_PATH}" | tr -d ' ')

          TEXT="⚡ <b>MCons Beta Build v1.0.3.${{ github.run_number }}</b> (Size: $(du -sh ${FILE_PATH} | awk '{print $1}'))\n\n📅 <b>Date:</b> ${{ steps.meta.outputs.date }}\n🔖 <b>Last Commit:</b> ${{ steps.meta.outputs.last_commit }}\n\n🚀 <b>Install Command (Recommended):</b>\n<code>curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash</code>\n\n⚠️ <i>Note: Direct download will be blocked by macOS Gatekeeper. Use the 1-line script above.</i>\n\n🔗 <b>Release Page:</b> <a href=\"${RELEASE_URL}\">${RELEASE_URL}</a>"

          RESPONSE=$(curl -sS --max-time 30 \
               --form-string "chat_id=${CHANNEL_ID}" \
               --form-string "parse_mode=HTML" \
               --form-string "text=$(echo -e "${TEXT}")" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"

          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Beta notification sent to Telegram!"
          else
            echo "❌ Failed to send Beta notification to Telegram!"
            exit 1
          fi

      # --- PRODUCTION BUILD ---
      - name: Create GitHub Release
        if: ${{ inputs.build_type == 'Production Build' }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3.${{ github.run_number }}
          name: MCons Production Release v1.0.3.${{ github.run_number }}
          generate_release_notes: true
          body: |
            ### ⚡ Quick Install (macOS 14.0+)

            > [!WARNING]
            > **Direct `.zip` browser downloads will be blocked by macOS Gatekeeper.**
            > **Please install / update only via this 1-line command in Terminal:**

            ```bash
            curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash
            ```
          files: output/MCons-v1.0.3-release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Production Build to Telegram Channel
        if: ${{ inputs.build_type == 'Production Build' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          FILE_PATH="output/MCons-v1.0.3-release.zip"
          ls -lh "${FILE_PATH}" || { echo "❌ Zip file not found!"; exit 1; }
          FILE_SIZE=$(wc -c < "${FILE_PATH}" | tr -d ' ')

          TEXT="🚀 <b>MCons Production Release v1.0.3.${{ github.run_number }}</b> (Size: $(du -sh ${FILE_PATH} | awk '{print $1}'))\n\n📅 <b>Date:</b> ${{ steps.meta.outputs.date }}\n🔖 <b>Last Commit:</b> ${{ steps.meta.outputs.last_commit }}\n\n🚀 <b>Install Command (Recommended):</b>\n<code>curl -fsSL https://raw.githubusercontent.com/neel0210/MCons/main/install.sh | bash</code>\n\n⚠️ <i>Note: Direct download will be blocked by macOS Gatekeeper. Use the 1-line script above.</i>\n\n🔗 <b>Release Page:</b> <a href=\"${RELEASE_URL}\">${RELEASE_URL}</a>"

          RESPONSE=$(curl -sS --max-time 30 \
               --form-string "chat_id=${CHANNEL_ID}" \
               --form-string "parse_mode=HTML" \
               --form-string "text=$(echo -e "${TEXT}")" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"

          if [[ "$RESPONSE" == *"\"ok\":true"* ]]; then
            echo "✅ Production notification sent to Telegram!"
          else
            echo "❌ Failed to send Production notification to Telegram!"
            exit 1
          fi

      # --- FAILURE NOTIFICATION ---
      - name: Send Error Notification to Telegram Group
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf "⚠️ MCons Build Failed!\nBuild Type: %s\nTriggered by: %s\nRun URL: %s/%s/actions/runs/%s" \
            "${{ inputs.build_type }}" \
            "${{ github.actor }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}" > /tmp/error_text.txt

          RESPONSE=$(curl -sS --max-time 30 \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "text=$(cat /tmp/error_text.txt)" \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" 2>&1)
          echo "Telegram Raw Output: ${RESPONSE}"
