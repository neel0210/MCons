name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish Release to GitHub Releases?'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.1.0, or leave empty for auto v<version>.<run_number>)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as Pre-release / Beta?'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace

  init-release:
    name: Prepare Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            TAG="v${VERSION}.${{ github.run_number }}"
          fi
          PRERELEASE_FLAG=""
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "MCons $TAG" \
            --notes "## 🚀 MCons Release $TAG"$'\n\n'"Release assets for macOS & Windows." \
            $PRERELEASE_FLAG || echo "Release already exists"

  build-macos:
    name: Build macOS (Universal)
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-macos-universal-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-macos-universal-

      - name: Build Universal Binaries
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../output
          lipo -create -output ../output/mcons target/aarch64-apple-darwin/release/mcons target/x86_64-apple-darwin/release/mcons
          lipo -create -output ../output/mcons-app target/aarch64-apple-darwin/release/mcons-app target/x86_64-apple-darwin/release/mcons-app
          strip ../output/mcons ../output/mcons-app
          file ../output/mcons ../output/mcons-app

      - name: Create macOS App Bundle
        run: |
          BUNDLE=output/MCons.app/Contents
          mkdir -p "$BUNDLE/MacOS" "$BUNDLE/Resources"
          cp output/mcons-app "$BUNDLE/MacOS/"

          VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          cat > "$BUNDLE/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>mcons-app</string>
            <key>CFBundleIdentifier</key><string>com.neel0210.mcons</string>
            <key>CFBundleName</key><string>MCons</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          cp -R MCons/Resources/IconPacks "$BUNDLE/Resources/" 2>/dev/null || true

          if [ -f MCons/Resources/AppIcon.icns ]; then
            cp MCons/Resources/AppIcon.icns "$BUNDLE/Resources/AppIcon.icns"
          elif [ -f rust/crates/mcons-app/web/appicon.png ]; then
            ICONSET=$(mktemp -d)/AppIcon.iconset
            mkdir -p "$ICONSET"
            for s in 16 32 64 128 256 512 1024; do
              sips -z $s $s rust/crates/mcons-app/web/appicon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null 2>&1 || true
            done
            cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png" 2>/dev/null || true
            iconutil -c icns "$ICONSET" -o "$BUNDLE/Resources/AppIcon.icns" 2>/dev/null || true
          fi

          codesign --force --deep --sign - output/MCons.app

      - name: Create DMG & ZIP
        run: |
          STAGING=$(mktemp -d)
          cp -R output/MCons.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname MCons -srcfolder "$STAGING" -ov -format UDZO output/MCons.dmg
          rm -rf "$STAGING"

          cd output
          ditto -c -k --sequesterRsrc --keepParent MCons.app MCons-release.zip

      - name: Upload macOS Artifacts (Quota-Safe)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mcons-macos-universal
          path: |
            output/MCons.dmg
            output/MCons-release.zip
            output/mcons
          retention-days: 1

      - name: Upload macOS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            TAG="v${VERSION}.${{ github.run_number }}"
          fi
          gh release upload "$TAG" output/MCons.dmg output/MCons-release.zip output/mcons --clobber

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Windows Distribution
        shell: pwsh
        run: |
          mkdir staging -Force
          cp rust/target/x86_64-pc-windows-msvc/release/mcons.exe staging/
          cp rust/target/x86_64-pc-windows-msvc/release/mcons-app.exe staging/
          cp -r MCons/Resources/IconPacks staging/
          Compress-Archive -Path staging/* -DestinationPath staging/MCons-windows-x64.zip

      - name: Build MSI Installer
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet tool install --global wix || true
          wix eula accept wix7 2>$null || true
          wix build -acceptEula wix7 -o staging/MCons-Setup.msi rust/wix/main.wxs || true

      - name: Build Portable Single-File EXE (NSIS)
        shell: pwsh
        continue-on-error: true
        run: |
          choco install nsis -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) {
            $makensis = "makensis"
          }
          mkdir rust/output -Force
          mkdir rust/staging -Force
          cp staging/* rust/staging/ -Recurse -Force
          & $makensis rust/nsis/portable.nsi
          if (Test-Path rust/output/MCons.exe) {
            cp rust/output/MCons.exe staging/MCons.exe
          }

      - name: Upload Windows Artifacts (Quota-Safe)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mcons-windows-x64
          path: staging/*
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Windows to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $TAG = "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag_name }}") {
            $TAG = "${{ github.event.inputs.tag_name }}"
          } else {
            $VERSION = (Get-Content rust/Cargo.toml | Select-String '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
            $TAG = "v$VERSION.${{ github.run_number }}"
          }
          Get-ChildItem -Path staging -File | ForEach-Object {
            gh release upload $TAG $_.FullName --clobber
          }
