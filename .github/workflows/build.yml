name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish Release to GitHub Releases?'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Release Tag (e.g. v1.1.0, or leave empty for auto v<version>.<run_number>)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as Pre-release / Beta?'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.arch }}
          path: |
            rust/target/${{ matrix.target }}/release/mcons
            rust/target/${{ matrix.target }}/release/mcons-app

  package-macos:
    name: Package macOS Universal
    needs: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: bins-arm64
          path: bins/arm64/

      - name: Download x86_64 binaries
        uses: actions/download-artifact@v4
        with:
          name: bins-x86_64
          path: bins/x86_64/

      - name: Create universal binaries
        run: |
          mkdir -p output
          chmod +x bins/arm64/mcons bins/arm64/mcons-app bins/x86_64/mcons bins/x86_64/mcons-app
          lipo -create -output output/mcons bins/arm64/mcons bins/x86_64/mcons
          lipo -create -output output/mcons-app bins/arm64/mcons-app bins/x86_64/mcons-app
          strip output/mcons output/mcons-app
          file output/mcons output/mcons-app

      - name: Create macOS App Bundle
        run: |
          BUNDLE=output/MCons.app/Contents
          mkdir -p "$BUNDLE/MacOS" "$BUNDLE/Resources"
          cp output/mcons-app "$BUNDLE/MacOS/"

          # Info.plist
          VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          cat > "$BUNDLE/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>mcons-app</string>
            <key>CFBundleIdentifier</key><string>com.neel0210.mcons</string>
            <key>CFBundleName</key><string>MCons</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST

          # Bundled Icon Packs
          cp -R MCons/Resources/IconPacks "$BUNDLE/Resources/" 2>/dev/null || true

          # App Icon (.icns)
          if [ -f MCons/Resources/AppIcon.icns ]; then
            cp MCons/Resources/AppIcon.icns "$BUNDLE/Resources/AppIcon.icns"
          elif [ -f rust/crates/mcons-app/web/appicon.png ]; then
            ICONSET=$(mktemp -d)/AppIcon.iconset
            mkdir -p "$ICONSET"
            for s in 16 32 64 128 256 512 1024; do
              sips -z $s $s rust/crates/mcons-app/web/appicon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null 2>&1 || true
            done
            cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_256x256@2x.png" 2>/dev/null || true
            cp "$ICONSET/icon_1024x1024.png" "$ICONSET/icon_512x512@2x.png" 2>/dev/null || true
            iconutil -c icns "$ICONSET" -o "$BUNDLE/Resources/AppIcon.icns" 2>/dev/null || true
          fi

          # Ad-hoc sign
          codesign --force --deep --sign - output/MCons.app

      - name: Create DMG & ZIP
        run: |
          STAGING=$(mktemp -d)
          cp -R output/MCons.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname MCons -srcfolder "$STAGING" -ov -format UDZO output/MCons.dmg
          rm -rf "$STAGING"

          cd output
          ditto -c -k --sequesterRsrc --keepParent MCons.app MCons-release.zip
          zip -u MCons-release.zip mcons 2>/dev/null || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcons-macos-universal
          path: |
            output/MCons.dmg
            output/MCons-release.zip
            output/mcons
          retention-days: 14

  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Build
        working-directory: rust
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage Windows Distribution
        shell: pwsh
        run: |
          mkdir staging
          cp rust/target/x86_64-pc-windows-msvc/release/mcons.exe staging/
          cp rust/target/x86_64-pc-windows-msvc/release/mcons-app.exe staging/
          cp -r MCons/Resources/IconPacks staging/
          Compress-Archive -Path staging/* -DestinationPath staging/MCons-windows-x64.zip

      - name: Build MSI Installer
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix build -o staging/MCons-Setup.msi rust/wix/main.wxs

      - name: Build Portable Single-File EXE (NSIS)
        shell: pwsh
        run: |
          mkdir rust/output -Force
          mkdir rust/staging -Force
          cp staging/* rust/staging/ -Recurse -Force
          makensis rust/nsis/portable.nsi
          cp rust/output/MCons.exe staging/MCons.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcons-windows-x64
          path: |
            staging/MCons.exe
            staging/MCons-windows-x64.zip
            staging/MCons-Setup.msi
            staging/mcons.exe
            staging/mcons-app.exe
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [package-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: mcons-macos-universal
          path: release-assets/

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: mcons-windows-x64
          path: release-assets/

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            TAG="v${VERSION}.${{ github.run_number }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Rename release assets
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          cd release-assets
          [[ -f MCons-release.zip ]] && cp MCons-release.zip "MCons-${TAG}-release.zip"
          [[ -f MCons.dmg ]] && cp MCons.dmg "MCons-${TAG}-release.dmg"
          [[ -f MCons.exe ]] && cp MCons.exe "MCons-${TAG}-windows-portable.exe"
          [[ -f MCons-windows-x64.zip ]] && cp MCons-windows-x64.zip "MCons-${TAG}-windows-x64.zip"
          [[ -f MCons-Setup.msi ]] && cp MCons-Setup.msi "MCons-${TAG}-Setup.msi"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "MCons ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          body: |
            ## 🚀 MCons Release ${{ steps.meta.outputs.tag }}

            ### 🍎 macOS (Universal: Apple Silicon & Intel)
            - **`MCons.dmg`** / **`MCons-${{ steps.meta.outputs.tag }}-release.dmg`** — Drag-and-drop disk image
            - **`MCons-release.zip`** / **`MCons-${{ steps.meta.outputs.tag }}-release.zip`** — Standalone .app bundle
            - **`mcons`** — CLI binary (Universal)
            > Note: On macOS, if prompted by Gatekeeper: run `xattr -cr /Applications/MCons.app`

            ### 🪟 Windows (x64)
            - **`MCons.exe`** / **`MCons-${{ steps.meta.outputs.tag }}-windows-portable.exe`** — Single portable executable (all bundled inside, no install needed)
            - **`MCons-Setup.msi`** / **`MCons-${{ steps.meta.outputs.tag }}-Setup.msi`** — Windows MSI Installer
            - **`MCons-windows-x64.zip`** / **`MCons-${{ steps.meta.outputs.tag }}-windows-x64.zip`** — Portable zip archive
            - **`mcons.exe`** — Windows CLI binary

            ---
            *Built automatically via GitHub Actions at ${{ steps.meta.outputs.date }}*
          files: |
            release-assets/MCons.dmg
            release-assets/MCons-*-release.dmg
            release-assets/MCons-release.zip
            release-assets/MCons-*-release.zip
            release-assets/mcons
            release-assets/MCons.exe
            release-assets/MCons-*-windows-portable.exe
            release-assets/MCons-Setup.msi
            release-assets/MCons-*-Setup.msi
            release-assets/MCons-windows-x64.zip
            release-assets/MCons-*-windows-x64.zip
            release-assets/mcons.exe
            release-assets/mcons-app.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
