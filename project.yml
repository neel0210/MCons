name: MCons
options:
  bundleIdPrefix: com.neel0210
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "MCons"
    INFOPLIST_FILE: "MCons/Resources/Info.plist"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: true
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MCons:
    type: application
    platform: macOS
    sources:
      - path: MCons
        excludes:
          - "**/*.xcassets/*/Contents.json"
    resources:
      - path: MCons/Resources/Assets.xcassets
      - path: MCons/Resources/IconPacks
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: "MCons/Resources/Info.plist"
        CODE_SIGN_ENTITLEMENTS: "MCons/Resources/MCons.entitlements"
        PRODUCT_BUNDLE_IDENTIFIER: com.neel0210.mcons
    entitlements:
      path: MCons/Resources/MCons.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
